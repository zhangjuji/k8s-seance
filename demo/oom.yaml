# Dies of OOMKilled: the process allocates 256M while the container limit is 64Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-glutton
  namespace: seance-demo
  labels:
    app.kubernetes.io/name: memory-glutton
    app.kubernetes.io/part-of: k8s-seance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-glutton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-glutton
        app.kubernetes.io/part-of: k8s-seance
    spec:
      containers:
        - name: stress
          # polinux/stress has no entrypoint, so the command must name the binary explicitly.
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "256M", "--vm-hang", "1"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
