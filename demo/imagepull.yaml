# Never starts: the image tag does not exist, so the pod sits in ErrImagePull / ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lost-soul
  namespace: seance-demo
  labels:
    app.kubernetes.io/name: lost-soul
    app.kubernetes.io/part-of: k8s-seance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lost-soul
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lost-soul
        app.kubernetes.io/part-of: k8s-seance
    spec:
      containers:
        - name: web
          image: nginx:does-not-exist-666
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
