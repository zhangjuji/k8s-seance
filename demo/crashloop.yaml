# Dies in a CrashLoopBackOff: at start the app checks /etc/app/config.yaml. When
# the file is missing it prints a FATAL line and exits 1. When the file exists it
# stays up, so the resurrection spell (a ConfigMap mounted with subPath) really
# brings it back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restless-spirit
  namespace: seance-demo
  labels:
    app.kubernetes.io/name: restless-spirit
    app.kubernetes.io/part-of: k8s-seance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restless-spirit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restless-spirit
        app.kubernetes.io/part-of: k8s-seance
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo starting restless-spirit
              if [ ! -f /etc/app/config.yaml ]; then
                echo FATAL: config /etc/app/config.yaml not found
                exit 1
              fi
              echo config /etc/app/config.yaml found, resting in peace
              while true; do sleep 3600; done
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "100m"
