# Dies after a bad release (Requirement 16.6). Version 1 runs with MODE=normal
# and stays healthy. kill-them-all.sh then releases MODE=turbo, which the app
# does not know: the new Pod exits 1 and falls into CrashLoopBackOff.
#
# maxUnavailable: 0 keeps both version 1 Pods alive while the new Pod is never
# ready, so the summoned spirit has a living former life and the family verdict
# is "the release broke it". The resurrection spell then rolls back first.
#
# The readiness probe and minReadySeconds stop a crashing Pod from counting as
# available in the moment between its start and its exit, so the rollout never
# scales the old Pods down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-life
  namespace: seance-demo
  labels:
    app.kubernetes.io/name: second-life
    app.kubernetes.io/part-of: k8s-seance
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: second-life
  template:
    metadata:
      labels:
        app.kubernetes.io/name: second-life
        app.kubernetes.io/part-of: k8s-seance
    spec:
      containers:
        - name: app
          image: busybox:1.36
          env:
            - name: MODE
              value: "normal"
          command:
            - sh
            - -c
            - |
              echo "second-life: starting in mode ${MODE}"
              case "${MODE}" in
                normal)
                  touch /tmp/ready
                  echo "second-life: alive and well"
                  while true; do sleep 3600; done
                  ;;
                *)
                  echo "FATAL: unknown mode ${MODE}"
                  exit 1
                  ;;
              esac
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "100m"
