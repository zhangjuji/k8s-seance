{{define "postmortem"}}<section class="postmortem" aria-label="{{T "pm_aria"}}">
  <div class="pm-bar">
    <button type="button" id="pm-copy">{{T "pm_copy"}}</button>
    <a class="pm-download" href="{{.DownloadURL}}">{{T "pm_download"}}</a>
    {{if .TombstoneURL}}<a class="pm-tomb" href="{{.TombstoneURL}}">{{T "pm_tomb"}}</a>{{end}}
  </div>
  {{if eq .Mode "template"}}<p class="pm-note">{{Tf "pm_note" .Reason}}</p>{{end}}
  <pre id="pm-md">{{.Markdown}}</pre>
  <script>
  (function () {
    var btn = document.getElementById('pm-copy');
    btn.addEventListener('click', function () {
      var text = document.getElementById('pm-md').textContent;
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = {{T "pm_copied"}};
      }, function () {
        btn.textContent = {{T "pm_copy_failed"}};
      });
    });
  })();
  </script>
</section>{{end}}
