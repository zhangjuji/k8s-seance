{{define "content"}}<section id="page" class="graveyard">
  <h1>墓地</h1>
  <p class="graveyard-intro">每个生成过复盘的亡灵都在这里立了碑，最近死去的排在最前。</p>

  {{if .Notice}}
  <div class="notice" role="alert"><p>{{.Notice}}</p></div>
  {{else if .Stones}}
  <ul class="tombs">
    {{range .Stones}}
    <li class="tomb">
      <a class="tomb-link" href="{{.URL}}">
        <span class="tomb-rip">R.I.P.</span>
        <span class="tomb-name">{{.Pod}}</span>
        <span class="tomb-ns">{{.Namespace}}</span>
        <span class="badge {{.BadgeClass}}">{{.Cause}}</span>
        <span class="tomb-dates"><span>生：{{.Born}}</span><span>卒：{{.Died}}</span></span>
        <span class="tomb-epitaph">“{{.Epitaph}}”</span>
      </a>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p>墓地还是空的。召唤一个亡灵并生成复盘，它就会在这里立碑。</p>
  {{end}}
</section>{{end}}
