{{define "turn"}}<div class="turn turn-{{.Role}}{{if .Advice}} turn-advice{{end}}{{if .Doubts}} turn-doubted{{end}}" data-turn="{{.Index}}" data-used="{{.Used}}" data-left="{{.Left}}" data-doubts="{{len .Doubts}}"{{with .Verdict}} data-verdict="{{.}}"{{end}}><span class="who">{{.Who}}</span><p class="text">{{.Body}}</p>{{with .Doubts}}<div class="doubts" role="note"><strong class="doubts-title">{{T "doubt_title"}}</strong><ul>{{range .}}<li data-kind="{{.Kind}}">{{.Message}}</li>{{end}}</ul><p class="doubts-note">{{T "doubt_note"}}</p></div>{{end}}</div>{{end}}
